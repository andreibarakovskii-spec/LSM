name: Relay tests

on:
  push:
    branches:
      - main
      - feature/store-forward-relay
  pull_request:

jobs:
  test-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test offline store-and-forward delivery
        working-directory: relay
        run: python -m unittest -v test_relay.py
